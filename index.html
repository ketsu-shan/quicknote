<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNote</title>
    <style>
      body {
        font-family: 'Inter', sans-serif;
        /* Transparent background for Electron */
        background: transparent;
        overflow: hidden;
      }

      /* Electron window drag region */
      .draggable-region {
        -webkit-app-region: drag;
      }
      .draggable-region button,
      .draggable-region input {
        -webkit-app-region: no-drag;
      }
      
      /* Custom scrollbar for the glass look */
      .glass-scroll::-webkit-scrollbar {
        width: 6px;
      }
      .glass-scroll::-webkit-scrollbar-track {
        background: transparent;
      }
      .glass-scroll::-webkit-scrollbar-thumb {
        background-color: rgba(255, 255, 255, 0.3);
        border-radius: 20px;
      }
      .glass-scroll::-webkit-scrollbar-thumb:hover {
        background-color: rgba(255, 255, 255, 0.5);
      }

      /* --- EMOTIONAL VALUE ANIMATIONS --- */

      /* 1. Jelly Bounce for Checkbox */
      @keyframes check-jelly {
        0% { transform: scale(1); }
        30% { transform: scale(1.25); }
        50% { transform: scale(0.9); }
        70% { transform: scale(1.1); }
        100% { transform: scale(1); }
      }
      .animate-jelly {
        animation: check-jelly 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      /* 2. Particle Burst */
      @keyframes particle-out {
        0% { 
          transform: translate(-50%, -50%) scale(1); 
          opacity: 1; 
        }
        100% { 
          transform: translate(var(--tw-translate-x), var(--tw-translate-y)) scale(0); 
          opacity: 0; 
        }
      }
      .animate-particle {
        animation: particle-out 0.6s ease-out forwards;
      }

      /* 3. Smooth Strikethrough Line */
      .strike-line {
        position: absolute;
        top: 50%;
        left: 0;
        height: 1.5px;
        background-color: rgba(255,255,255,0.4);
        width: 0%;
        transition: width 0.4s cubic-bezier(0.65, 0, 0.35, 1);
        pointer-events: none;
      }
      .group.completed .strike-line {
        width: 100%;
      }
    </style>
