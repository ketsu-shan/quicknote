<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>

    <!-- Note shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.25"/>
    </filter>

    <!-- Inner glow for note -->
    <linearGradient id="noteGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f1f5f9"/>
    </linearGradient>

    <!-- Checkmark gradient -->
    <linearGradient id="checkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGradient)"/>

  <!-- Decorative circles in background -->
  <circle cx="420" cy="120" r="60" fill="white" fill-opacity="0.1"/>
  <circle cx="100" cy="400" r="40" fill="white" fill-opacity="0.08"/>

  <!-- Note paper with folded corner -->
  <g filter="url(#shadow)">
    <!-- Main note body -->
    <path d="M120 100 L350 100 L392 142 L392 412 Q392 428 376 428 L136 428 Q120 428 120 412 Z" fill="url(#noteGradient)"/>
    <!-- Folded corner -->
    <path d="M350 100 L350 142 Q350 150 358 150 L392 150 L392 142 Z" fill="#e2e8f0"/>
  </g>

  <!-- Task lines -->
  <rect x="160" y="180" width="180" height="12" rx="6" fill="#cbd5e1"/>
  <rect x="160" y="230" width="140" height="12" rx="6" fill="#cbd5e1"/>
  <rect x="160" y="280" width="160" height="12" rx="6" fill="#cbd5e1"/>
  <rect x="160" y="330" width="120" height="12" rx="6" fill="#cbd5e1"/>

  <!-- Checkmark circle (completed task indicator) -->
  <circle cx="380" cy="380" r="64" fill="url(#checkGradient)"/>
  <path d="M348 380 L368 400 L412 352" stroke="white" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Small decorative dots on note -->
  <circle cx="152" cy="186" r="8" fill="#a855f7"/>
  <circle cx="152" cy="236" r="8" fill="#8b5cf6"/>
  <circle cx="152" cy="286" r="8" fill="#6366f1"/>
  <circle cx="152" cy="336" r="8" fill="#cbd5e1"/>
</svg>
